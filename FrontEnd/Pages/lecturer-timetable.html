<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Timetable – LHAS</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-university"></i><span>LHAS</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">My Schedule</div>
          <a href="lecturer-timetable.html" class="nav-link active"><i class="fas fa-calendar-alt"></i> My Timetable</a>
          <a href="book-hall.html" class="nav-link"><i class="fas fa-calendar-plus"></i> Book a Hall</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <a href="#" class="nav-link" data-logout><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">NP</div>
          <div class="user-meta"><div class="name">Dr. Nimal Perera</div><div class="role">Lecturer</div></div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">My Teaching Timetable</h1>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" title="Notifications"><i class="fas fa-bell"></i><span class="badge">1</span></button>
        </div>
      </header>

      <main class="content-area">
        <div class="alert alert-info mb-2">
          <i class="fas fa-info-circle"></i> Showing approved allocations for your classes. You will be notified when halls are changed.
        </div>

        <div class="card">
          <div class="card-header"><h2>Upcoming Classes</h2></div>
          <div class="card-body">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Subject</th>
                    <th>Hall</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="myTT"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = LHAS.requireAuth(['lecturer']);
      if (!session) return;
      LHAS.initLayout(session);

      const response = await fetch(
        `/api/timetable?email=${encodeURIComponent(session.email)}`
      );

      if (!response.ok) {
        throw new Error('Failed to fetch timetable');
      }

      const allocations = await response.json();

      const tbody = document.getElementById('myTT');
      if (!allocations.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><p>No upcoming classes scheduled.</p></div></td></tr>';
        return;
      }

      allocations.forEach(a => {

        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td>${a.date ? String(a.date).slice(0, 10).split('-').reverse().join('/') : '—'}</td>
          <td>${a.start_time.slice(0, 5)} - ${a.end_time.slice(0, 5)}</td>
          <td>${LHAS.esc(a.subject)}</td>
          <td>${a.hall || '—'}</td>
          <td>${a.status}</td>
        `;
        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
