<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = LHAS.requireAuth(['admin']);
  if (!session) return;

  LHAS.initLayout(session);

  const hallSelect = document.getElementById('filterHall');
  const lectSelect = document.getElementById('filterLecturer');
  const tbody = document.getElementById('ttBody');
  const empty = document.getElementById('ttEmpty');

  let timetable = [];

  async function loadTimetable() {
    try {
      const response = await fetch('/api/admin/timetable');

      if (!response.ok) {
        throw new Error('Failed to fetch timetable data');
      }

      timetable = await response.json();

      // Populate hall filter from backend data
      const halls = [...new Map(
        timetable.map(a => [
          a.hall_id,
          { id: a.hall_id, name: a.hall_name }
        ])
      ).values()];

      halls.forEach(h => {
        const option = document.createElement('option');
        option.value = h.id;
        option.textContent = h.name;
        hallSelect.appendChild(option);
      });

      // Populate lecturer filter from backend data
      const lecturers = [...new Map(
        timetable
          .filter(a => a.lecturer_index_no && a.lecturer_name)
          .map(a => [
            a.lecturer_index_no,
            { id: a.lecturer_index_no, name: a.lecturer_name }
          ])
      ).values()];

      lecturers.forEach(l => {
        const option = document.createElement('option');
        option.value = l.id;
        option.textContent = l.name;
        lectSelect.appendChild(option);
      });

      render();
    } catch (error) {
      console.error('Error loading timetable:', error);
      tbody.innerHTML = '';
      empty.classList.remove('hidden');
      empty.querySelector('p').textContent =
        'Failed to load timetable data. Please try again.';
    }
  }

  function render() {
    const date = document.getElementById('filterDate').value;
    const hallId = hallSelect.value;
    const lecturerId = lectSelect.value;

    document.getElementById('ttTitle').textContent =
      `Timetable – ${date}`;

    let list = timetable.filter(a =>
      String(a.date).slice(0, 10) === date &&
      a.status === 'confirmed'
    );

    if (hallId) {
      list = list.filter(a => String(a.hall_id) === hallId);
    }

    if (lecturerId) {
      list = list.filter(a =>
        String(a.lecturer_index_no) === lecturerId
      );
    }

    tbody.innerHTML = '';

    if (!list.length) {
      empty.classList.remove('hidden');
      empty.querySelector('p').textContent =
        'No classes found for the selected filters.';
      return;
    }

    empty.classList.add('hidden');

    list.sort((a, b) =>
      String(a.start_time).localeCompare(String(b.start_time))
    );

    list.forEach(a => {
      const start = String(a.start_time).slice(0, 5);
      const end = String(a.end_time).slice(0, 5);

      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${start} – ${end}</td>
        <td>
          <strong>${a.subject_code || '—'}</strong><br>
          <span class="text-muted" style="font-size:.75rem">
            ${a.subject_name || ''}
          </span>
        </td>
        <td>${a.lecturer_name || '—'}</td>
        <td>${a.hall_name || '—'}</td>
        <td>
          <span class="status status-${a.status}">
            ${a.status}
          </span>
        </td>
      `;

      tbody.appendChild(tr);
    });
  }

  document.getElementById('filterDate')
    .addEventListener('change', render);

  hallSelect.addEventListener('change', render);
  lectSelect.addEventListener('change', render);

  await loadTimetable();
});
</script>
