<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Timetable – LHAS</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-university"></i><span>LHAS</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">My Schedule</div>
          <a href="student-timetable.html" class="nav-link active"><i class="fas fa-calendar-alt"></i> Class Timetable</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <a href="#" class="nav-link" data-logout><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">KS</div>
          <div class="user-meta"><div class="name">Kamal Silva</div><div class="role">Student</div></div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">Published Class Timetable</h1>
        </div>
        <div class="topbar-right"><button class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></button></div>
      </header>

      <main class="content-area">
        <div class="filters">
          <div class="form-group">
            <label for="fBatch">Batch year</label>
            <select id="fBatch">
              <option value="">All batches</option>
              <option value="1">Year 1</option>
              <option value="2">Year 2</option>
              <option value="3">Year 3</option>
              <option value="4">Year 4</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fShow">Show</label>
            <select id="fShow">
              <option value="upcoming">Upcoming classes</option>
              <option value="week">This week</option>
              <option value="all">Everything</option>
            </select>
          </div>
          <button class="btn btn-outline" id="fClear" type="button"><i class="fas fa-times"></i> Clear filters</button>
        </div>

        <div class="card">
          <div class="card-header"><h2 id="ttTitle">Upcoming Classes</h2></div>
          <div class="card-body">
            <div class="table-responsive">
              <table>
                <thead><tr><th>Date</th><th>Time</th><th>Subject</th><th>Batch</th><th>Hall</th><th>Lecturer</th></tr></thead>
                <tbody id="studentTT"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = LHAS.requireAuth(['student']);
      if (!session) return;
      LHAS.initLayout(session);

      const $ = id => document.getElementById(id);
      const esc = LHAS.esc;
      const pad = n => String(n).padStart(2, '0');
      const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const today = ymd(new Date());
      const weekEnd = ymd(new Date(Date.now() + 6 * 86400000));
      const fmtDate = d => String(d).slice(0, 10).split('-').reverse().join('/');
      let all = [];

      // Start with the student's own batch when it is known
      if (session.batchYear) $('fBatch').value = String(session.batchYear);

      const res = await fetch('/api/timetable');
      if (!res.ok) { LHAS.showToast('Failed to load the timetable', 'error'); return; }
      all = await res.json();
      render();

      function render() {
        const batch = $('fBatch').value;
        const show = $('fShow').value;
        $('ttTitle').textContent = { upcoming: 'Upcoming Classes', week: "This Week's Classes", all: 'All Published Classes' }[show];
        const rows = all.filter(a => {
          const d = String(a.date).slice(0, 10);
          if (batch && String(a.batch_year) !== batch) return false;
          if (show === 'upcoming') return d >= today;
          if (show === 'week') return d >= today && d <= weekEnd;
          return true;
        }).sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.start_time).localeCompare(String(b.start_time)));

        const tbody = $('studentTT');
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>No published classes match these filters.</p></div></td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(a => `
          <tr>
            <td>${fmtDate(a.date)}</td>
            <td>${String(a.start_time).slice(0, 5)} - ${String(a.end_time).slice(0, 5)}</td>
            <td><strong>${esc(a.subject_code)}</strong><br><span class="text-muted" style="font-size:.78rem">${esc(a.subject)}</span></td>
            <td>${a.batch_year ? 'Year ' + a.batch_year : '—'}</td>
            <td>${esc(a.hall) || '—'}</td>
            <td>${esc(a.lecturer_name) || '—'}</td>
          </tr>`).join('');
      }
      $('fBatch').addEventListener('change', render);
      $('fShow').addEventListener('change', render);
      $('fClear').addEventListener('click', () => { $('fBatch').value = ''; $('fShow').value = 'upcoming'; render(); });
    });
  </script>
</body>
</html>
