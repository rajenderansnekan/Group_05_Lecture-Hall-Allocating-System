<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LHAS – Lecturer Hall Allocation System</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <i class="fas fa-university"></i>
          <span>LHAS</span>
        </div>
        <h1>Lecturer Hall Allocation System</h1>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email / Username</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="text" id="email" name="email" placeholder="admin@university.edu" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox">
            <input type="checkbox" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <div id="loginError" class="alert alert-error" hidden></div>
      </form>

      <div class="demo-accounts">
        <p>Demo accounts (click to fill):</p>
        <div class="demo-btns">
          <button type="button" class="demo-btn" data-role="admin" data-email="admin@lhas.edu" data-pass="admin123">
            <i class="fas fa-user-shield"></i> Admin
          </button>
          <button type="button" class="demo-btn" data-role="lecturer" data-email="lecturer@lhas.edu" data-pass="lect123">
            <i class="fas fa-chalkboard-teacher"></i> Lecturer
          </button>
          <button type="button" class="demo-btn" data-role="student" data-email="student@lhas.edu" data-pass="stud123">
            <i class="fas fa-user-graduate"></i> Student
          </button>
        </div>
      </div>
    </div>

    <footer class="auth-footer">
      <p>© 2026 Lecturer Hall Allocation System · Sabaragamuwa University of Sri Lanka</p>
      <p class="version">Version 1.0 · Software Requirements Specification</p>
    </footer>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
